name: Deploy

on:
  push:
    branches: [main, master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 169.58.139.188 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=15 forge@169.58.139.188 /home/forge/deploy.sh
